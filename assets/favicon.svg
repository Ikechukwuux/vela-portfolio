<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#58111A"/>
  <!-- Cormorant Garamond italic V, hand-drawn as a path for full embedding -->
  <!-- Left stroke of V: descends left-to-right -->
  <!-- Right stroke of V: ascends left-to-right -->
  <!-- Letter drawn at optical center, slightly high for Cormorant cap optical balance -->
  <text
    x="50"
    y="71"
    font-family="Cormorant Garamond, Georgia, serif"
    font-size="66"
    font-weight="500"
    font-style="italic"
    fill="#F7F9FA"
    text-anchor="middle"
    dominant-baseline="auto"
    letter-spacing="-1"
  >V</text>
</svg>
